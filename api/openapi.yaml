openapi: 3.1.0
info:
  title: Tagspot AI Hub API
  version: 0.1.0
servers:
  - url: http://127.0.0.1
security:
  - bearerAuth: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Report the backend state and version
      responses:
        '200':
          description: The backend is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: The bearer token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [state, version]
      properties:
        state:
          type: string
          enum: [running]
        version:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
